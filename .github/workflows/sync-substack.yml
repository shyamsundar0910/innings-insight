name: Sync Substack articles
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Substack RSS
        run: python scripts/update_substack.py
      - name: Commit new posts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest Substack articles"
            git push
          fi
